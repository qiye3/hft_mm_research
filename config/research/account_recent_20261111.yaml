  - .venv-models/bin/python
  - -u
  - scripts/run_cost_classifier.py
  - config/models/cost_recent60_20261111.yaml
  - train
  - --horizon
  - '1800'
  - --side
  - '1'
  - --seed
  - '17'
  - --fit-lookback-days
  - '60'
  threads: 2
  estimated_peak_gib: 18
  memory_limit_gib: 25
  allocation_limit_gib: 96
  lane: gpu
  priority: 0
  requires_success: []
  after_finished: []
  max_retries: 1
  retry_delay_seconds: 60
