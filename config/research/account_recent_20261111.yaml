# 四个GPU方向模型+八个开发账户案例，开发冻结后复核。
stage: overnight
queue_directory: config/research/account_recent_queue
output: workspace/results/account_recent_20261111_v1/queue
poll_seconds: 5
start_reserve_gib: 8
