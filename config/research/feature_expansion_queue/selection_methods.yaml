# 同一宽因子池的两种筛选规则，各自比较树与MLP；当前仅开发评价。
tasks:
- threads: 2
  lane: cpu
  priority: 0
  after_finished: &id001 []
  max_retries: 1
  retry_delay_seconds: 60
  id: select_family_balanced
  command:
  - .venv-models/bin/python
  - -u
  - scripts/select_feature_pool.py
  - config/models/feature_pool_family_balanced_20261114.yaml
  estimated_peak_gib: 4
  memory_limit_gib: 8
  allocation_limit_gib: 32
  requires_success:
  - expanded_inputs
- threads: 2
  lane: cpu
  priority: 0
  after_finished: *id001
  max_retries: 1
  retry_delay_seconds: 60
  id: family_balanced_xgb
  command:
  - flock
  - /tmp/hft_mm_research_gpu.lock
  - .venv-models/bin/python
  - -u
  - scripts/run_input_comparison.py
  - config/models/feature_model_family_balanced_20261114.yaml
  - train
  - --horizon
  - '180'
  - --group
  - combined
  - --family
  - xgb
  - --seed
  - '17'
  estimated_peak_gib: 18
  memory_limit_gib: 28
  allocation_limit_gib: 128
  requires_success:
  - select_family_balanced
- threads: 2
  lane: cpu
  priority: 0
