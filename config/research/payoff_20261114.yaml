  - --horizon
  - '1800'
  - --side
  - '-1'
  - --seed
  - '17'
  - --depth
  - '4'
  - --min-child-weight
  - '50'
  threads: 2
  estimated_peak_gib: 18
  memory_limit_gib: 25
  allocation_limit_gib: 96
  requires_success: *id001
  after_finished: *id002
  lane: gpu
  priority: 0
  max_retries: 1
  retry_delay_seconds: 60
- id: old_screen
