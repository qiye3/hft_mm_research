  - .venv-models/bin/python
  - -u
  - scripts/run_account_sizing.py
  - config/strategy/payoff_20261114.yaml
  - screen
  - --group
  - old
  threads: 2
  estimated_peak_gib: 6
  memory_limit_gib: 12
  allocation_limit_gib: 48
  requires_success:
  - old_side1
  - old_side-1
  after_finished: &id003 []
  lane: cpu
  priority: 1
  max_retries: 1
