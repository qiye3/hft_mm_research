# 两种输入各训练多空方向；使用GPU锁，自动开发回放，保留失败。
stage: overnight
queue_directory: config/research/payoff_queue
output: workspace/results/payoff_20261114_v1/queue
poll_seconds: 5
start_reserve_gib: 8
emergency_reserve_gib: 5
lane_limits:
  gpu: 1
  cpu: 1
morning_report_at: null
report_command: null
tasks:
- id: old_side1
  command:
  - .venv-models/bin/python
  - -u
  - scripts/run_cost_classifier.py
  - config/models/payoff_old_20261114.yaml
  - train
  - --horizon
  - '1800'
  - --side
  - '1'
  - --seed
  - '17'
  - --depth
  - '4'
  - --min-child-weight
  - '50'
  threads: 2
  estimated_peak_gib: 18
  memory_limit_gib: 25
  allocation_limit_gib: 96
  requires_success: &id001 []
  after_finished: &id002 []
  lane: gpu
  priority: 0
  max_retries: 1
  retry_delay_seconds: 60
- id: old_side-1
  command:
  - .venv-models/bin/python
  - -u
  - scripts/run_cost_classifier.py
  - config/models/payoff_old_20261114.yaml
