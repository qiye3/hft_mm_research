# 独立模型训练和评价队列。单个模型失败后记录并跳过，其他模型继续。
# 共享数据为必需依赖；冻结等待所有训练结束；报告如实列出缺少产物的模型。
stage: overnight
output: workspace/results/models/comparison_2026-11-09_v2/execution
poll_seconds: 5
start_reserve_gib: 8
emergency_reserve_gib: 6
lane_limits:
  cpu: 1
  gpu: 1
  evaluation: 3
morning_report_at: null
report_command:
- .venv-models/bin/python
- scripts/run_model_comparison.py
- config/models/comparison.yaml
- report
queue_directory: config/research/comparison_queue
