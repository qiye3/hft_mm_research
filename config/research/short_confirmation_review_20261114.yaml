# 已冻结compact6确认规则：先只推理180秒模型，再按开发门槛执行固定历史复核。
stage: overnight
queue_directory: config/research/short_confirmation_review_queue
output: workspace/results/short_confirmation_review_20261114_v1/queue
poll_seconds: 5
start_reserve_gib: 10
emergency_reserve_gib: 6
lane_limits:
  cpu: 1
morning_report_at: null
report_command: null
tasks:
- id: frozen_prediction
  command:
  - flock
  - /tmp/hft_mm_research_gpu.lock
  - .venv-models/bin/python
  - -u
  - scripts/predict_short_confirmation.py
  threads: 2
  estimated_peak_gib: 8
  memory_limit_gib: 16
  allocation_limit_gib: 48
  lane: cpu
  priority: 0
  requires_success: []
  after_finished: &id001 []
  max_retries: 0
  retry_delay_seconds: 60
- id: frozen_review
  command:
  - .venv-models/bin/python
  - -u
  - scripts/run_account_sizing.py
  - config/strategy/short_confirmation_20261114.yaml
  - review
  threads: 2
  estimated_peak_gib: 6
  memory_limit_gib: 12
  allocation_limit_gib: 48
  lane: cpu
  priority: 0
  requires_success:
  - frozen_prediction
  after_finished: *id001
  max_retries: 1
  retry_delay_seconds: 60
