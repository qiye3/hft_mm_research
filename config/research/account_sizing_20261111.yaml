# 两路固定账户规模实验，开发冻结后历史复核，单项失败独立重试。
stage: overnight
queue_directory: config/research/account_sizing_queue
output: workspace/results/account_sizing_20261111_v1/queue
poll_seconds: 5
start_reserve_gib: 8
emergency_reserve_gib: 5
lane_limits:
  cpu: 2
  gpu: 1
morning_report_at: null
report_command: null
tasks:
- id: cost1800
  command:
  - .venv-models/bin/python
  - -u
  - scripts/run_account_sizing.py
  - config/strategy/account_sizing_20261111.yaml
  - screen
  - --group
  - cost1800
  threads: 3
  estimated_peak_gib: 6
  memory_limit_gib: 12
  allocation_limit_gib: 48
  lane: cpu
  priority: 1
  requires_success: []
  after_finished: []
  max_retries: 1
  retry_delay_seconds: 60
- id: ensemble1800
  command:
  - .venv-models/bin/python
  - -u
  - scripts/run_account_sizing.py
  - config/strategy/account_sizing_20261111.yaml
  - screen
  - --group
  - ensemble1800
  threads: 3
  estimated_peak_gib: 6
  memory_limit_gib: 12
  allocation_limit_gib: 48
  lane: cpu
  priority: 1
  requires_success: []
  after_finished: []
  max_retries: 1
  retry_delay_seconds: 60
- id: review
  command:
  - .venv-models/bin/python
  - -u
  - scripts/run_account_sizing.py
  - config/strategy/account_sizing_20261111.yaml
  - review
  threads: 3
  estimated_peak_gib: 6
  memory_limit_gib: 12
  allocation_limit_gib: 48
  lane: cpu
  priority: 2
  requires_success:
  - cost1800
  - ensemble1800
  after_finished: []
  max_retries: 1
  retry_delay_seconds: 60
