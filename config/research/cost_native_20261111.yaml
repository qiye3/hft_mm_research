# 原生执行确认队列，动态加入全部必要回放区间，下载转换与已有区间回放并行。
stage: overnight
queue_directory: config/research/cost_native_queue
output: workspace/results/cost_native_20261111_v1/queue
poll_seconds: 5
start_reserve_gib: 8
emergency_reserve_gib: 5
lane_limits:
  cpu: 2
  data: 2
  network: 1
morning_report_at: null
report_command: null
tasks:
- id: plan
  command:
  - .venv-models/bin/python
  - -u
  - scripts/run_cost_native.py
  - config/strategy/cost_native_20261111.yaml
  - plan
  threads: 2
  estimated_peak_gib: 3
  memory_limit_gib: 8
  allocation_limit_gib: 32
  requires_success: []
  after_finished: []
  max_retries: 2
  retry_delay_seconds: 60
  lane: cpu
  priority: 0
- id: build
  command:
  - .venv-models/bin/python
  - -u
  - scripts/run_cost_native.py
  - config/strategy/cost_native_20261111.yaml
  - build
  threads: 2
  estimated_peak_gib: 4
  memory_limit_gib: 8
  allocation_limit_gib: 32
  requires_success: []
  after_finished: []
  max_retries: 2
  retry_delay_seconds: 60
  lane: cpu
  priority: 1
