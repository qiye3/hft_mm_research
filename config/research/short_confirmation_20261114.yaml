  - --group
  - e4
  threads: 2
  estimated_peak_gib: 6
  memory_limit_gib: 12
  allocation_limit_gib: 48
  lane: cpu
  priority: 0
  requires_success: &id001 []
  after_finished: &id002 []
  max_retries: 1
  retry_delay_seconds: 60
- id: compact6
  command:
  - .venv-models/bin/python
  - -u
  - scripts/run_account_sizing.py
  - config/strategy/short_confirmation_20261114.yaml
  - screen
  - --group
  - compact6
  threads: 2
  estimated_peak_gib: 6
  memory_limit_gib: 12
  allocation_limit_gib: 48
