poll_seconds: 5
start_reserve_gib: 10
emergency_reserve_gib: 6
lane_limits:
  cpu: 1
morning_report_at: null
report_command: null
tasks:
- id: e4
  command:
  - .venv-models/bin/python
  - -u
  - scripts/run_account_sizing.py
  - config/strategy/short_confirmation_20261114.yaml
