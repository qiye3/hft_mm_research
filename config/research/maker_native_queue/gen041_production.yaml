# 全历史Gen041生产；两路日期子进程，完成检查点复用，36列独立Parquet发布。
tasks:
- id: gen041_factors
  command:
  - .venv-models/bin/python
  - -u
  - scripts/run_gen041.py
  - config/factors/gen041_20261114.yaml
  - factors
  - --workers
  - '2'
  threads: 2
  estimated_peak_gib: 12
  memory_limit_gib: 18
  allocation_limit_gib: 48
  lane: cpu
  priority: 0
  requires_success:
  - gen041_threshold
  after_finished: []
  max_retries: 1
  retry_delay_seconds: 60
