# Gen041训练期阈值准备，与原生回放共享内存准入。
tasks:
- id: gen041_threshold
  command:
  - .venv-models/bin/python
  - -u
  - scripts/run_gen041.py
  - config/factors/gen041_20261114.yaml
  - threshold
  threads: 3
  estimated_peak_gib: 8
  memory_limit_gib: 16
  allocation_limit_gib: 48
  lane: cpu
  priority: 0
  requires_success:
  - build
  after_finished: []
  max_retries: 1
  retry_delay_seconds: 60
