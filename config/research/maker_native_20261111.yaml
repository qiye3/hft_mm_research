# 启动前先执行run_cost_native.py ... build并通过测试；队列复用该已验证构建。
stage: overnight
queue_directory: config/research/maker_native_queue
output: workspace/results/maker_native_20261111_v1/queue
poll_seconds: 5
start_reserve_gib: 8
emergency_reserve_gib: 5
lane_limits:
  cpu: 2
  data: 2
  network: 1
morning_report_at: null
report_command: null
tasks:
- id: plan
  command:
  - .venv-models/bin/python
  - -u
  - scripts/run_cost_native.py
  - config/strategy/maker_native_20261111.yaml
  - plan
  threads: 2
  estimated_peak_gib: 3
  memory_limit_gib: 8
  allocation_limit_gib: 32
  requires_success: []
  after_finished: []
  max_retries: 2
  retry_delay_seconds: 60
  lane: cpu
  priority: 0
- id: build
  command:
  - test
  - -x
  - workspace/results/maker_native_20261111_v1/build/strategy_replay
  threads: 2
  estimated_peak_gib: 1
  memory_limit_gib: 8
  allocation_limit_gib: 32
  requires_success: []
  after_finished: []
  max_retries: 2
  retry_delay_seconds: 60
  lane: cpu
  priority: 1
