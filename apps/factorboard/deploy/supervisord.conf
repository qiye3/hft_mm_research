[unix_http_server]
file=/root/shared-nvme/hft_mm_research/workspace/results/factorboard/service/supervisor.sock
chmod=0600

[supervisord]
pidfile=/root/shared-nvme/hft_mm_research/workspace/results/factorboard/service/supervisord.pid
logfile=/root/shared-nvme/hft_mm_research/workspace/results/factorboard/service/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///root/shared-nvme/hft_mm_research/workspace/results/factorboard/service/supervisor.sock

[program:factorboard]
directory=/root/shared-nvme/hft_mm_research
command=/usr/bin/nice -n 10 /root/shared-nvme/hft_mm_research/.venv/bin/python apps/factorboard/scripts/serve_results.py --project /root/shared-nvme/hft_mm_research --config /root/shared-nvme/hft_mm_research/apps/factorboard/deploy/results.json --port 8765
environment=POLARS_MAX_THREADS="2",OPENBLAS_NUM_THREADS="1",OMP_NUM_THREADS="1",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/root/shared-nvme/hft_mm_research/workspace/results/factorboard/service/server.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
